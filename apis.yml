name: Oshi Health
description: 'Oshi Health is a virtual, whole-person gastrointestinal (GI) care clinic
  delivering insurance-covered telehealth to patients with digestive conditions such
  as IBS, GERD, Crohn''s disease, and ulcerative colitis. Care is provided by a coordinated
  team of GI providers, registered dietitians, and gut-brain behavioral health specialists,
  and is offered to members through major health plans and employers. Oshi Health is
  a patient-facing healthcare services company rather than an API producer; it publishes
  no public developer API, developer portal, SDKs, or /.well-known/ discovery surface.
  This profile was added to the API Evangelist network as a portfolio company of Bessemer
  Venture Partners and enriched with the artifacts the company genuinely publishes.'
